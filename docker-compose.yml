# Development and single node deployment for Project Chronos.
#
# The ./data host directory is a single writable volume for all runtime state.
# Chronos downloads and caches the CAIDA AS-relationship dataset there
# automatically on startup, so nothing needs to be placed in it for the happy
# path. Optionally, drop mounted files into ./data and point the matching
# CHRONOS_* variables at them (see .env.example):
#   - GeoLite2-City.mmdb  (licensed; see the README for the dev download link)
#   - GeoLite2-ASN.mmdb   (licensed; see the README for the dev download link)
#   - a CAIDA as-rel dataset (optional; auto-downloaded when absent)
# None of these files are committed to source control.

services:
  chronos:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: chronos:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Read-write: Chronos caches the downloaded CAIDA dataset here.
      - ./data:/data
    restart: unless-stopped

  # Optional persistent anomaly history (opt-in). Enabled only with the
  # "history" compose profile, so the default stack stays stateless and needs no
  # database:
  #   docker compose --profile history up
  # Then set in .env: CHRONOS_HISTORY_ENABLED=true and
  #   CHRONOS_HISTORY_URL=postgres://chronos:chronos@postgres:5432/chronos
  # Chronos bounds its own storage (retention window plus a hard byte cap, 2 GiB
  # by default), so this volume does not grow without limit.
  postgres:
    image: postgres:17-alpine
    profiles: ["history"]
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
      POSTGRES_DB: chronos
    volumes:
      - chronos-history:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  chronos-history:

