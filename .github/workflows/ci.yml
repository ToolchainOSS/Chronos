name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Deny-all by default; each job opts into the narrowest scope it needs. This
# workflow only ever reads the checked-out code, so no privileged token is minted
# and untrusted PR code (or a compromised build dependency) has nothing to steal.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (fmt, clippy, tests, acceptance)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Compiler cache with a sharp trust boundary: only builds on the default
      # branch may *write* the cache (`save-if`), while pull requests restore it
      # read-only. A PR reuses main's warm cache for speed but can never persist
      # a poisoned artifact that a later trusted build would consume.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (unit, mock RIS integration, and e2e acceptance)
        # GeoLite2 and CAIDA data files are not present in CI (never committed);
        # tests exercise the disabled geo and heuristic relationship fallbacks.
        # `--workspace` includes the chronos-server acceptance suite, which
        # drives the real Axum router and the Delta WebSocket wire contract.
        run: cargo test --workspace --all-targets

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Non-blocking: exercises the real external data sources (CAIDA archive,
  # GeoLite2 mirror) that Chronos depends on in production. These endpoints can
  # be down transiently, so a failure here must NOT fail CI or block a merge;
  # instead it raises a warning annotation worth investigating (a genuine format
  # change or a persistent outage). Never treat this job as a quality gate.
  live-data:
    name: Live external-data checks (non-blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: live-data
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run live-data tests
        id: live
        continue-on-error: true
        # Hits the real CAIDA endpoint and the GeoLite2 mirror. Single-threaded
        # and verbose so failures name the exact source in the log.
        run: cargo test -p chronos-server --test live_data -- --ignored --nocapture --test-threads=1

      - name: Warn on failure
        if: steps.live.outcome == 'failure'
        run: |
          echo "::warning title=Live external-data check failed::A real data source \
          (CAIDA archive or GeoLite2 mirror) was unreachable or returned unexpected \
          data. This does not block CI, but investigate a possible outage or dataset \
          format change. See the 'Run live-data tests' step log for the exact source."
