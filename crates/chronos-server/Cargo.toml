[package]
name = "chronos-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Project Chronos server: orchestrates ingestion, topology, detection, and the Axum WebSocket egress."
default-run = "chronos-server"

[[bin]]
name = "chronos-server"
path = "src/main.rs"

[dependencies]
chronos-types = { path = "../chronos-types" }
chronos-ingest = { path = "../chronos-ingest" }
chronos-topology = { path = "../chronos-topology" }
chronos-detect = { path = "../chronos-detect" }
chronos-geo = { path = "../chronos-geo" }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
